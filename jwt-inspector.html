<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Inspector — Kodai Tech</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-terminal);
            border-top: 2px solid var(--accent-primary);
            padding: 2rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-bright);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 1rem;
            background-color: var(--bg-terminal);
            border: 1px solid var(--border-terminal);
            border-radius: 2px;
            color: var(--text-bright);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        .grid-outputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 768px) { .grid-outputs { grid-template-columns: 1fr; } }
        pre {
            background-color: var(--bg-terminal);
            padding: 1rem;
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-success);
            overflow-x: auto;
            max-height: 240px;
            border: 1px solid var(--border-terminal);
            margin-top: 0.5rem;
        }
        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.6rem;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: var(--font-mono);
            text-transform: uppercase;
        }
        .status-valid { background-color: rgba(16, 185, 129, 0.1); color: var(--accent-success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-expired { background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-invalid { background-color: rgba(245, 158, 11, 0.1); color: var(--accent-warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    </style>
</head>
<body>

    <div class="tool-container">
        <header class="app-header" style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-terminal); padding-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 style="font-size: 1.2rem; color: var(--text-bright); text-transform: uppercase;">JWT Inspector</h1>
                <p style="font-size: 0.8rem; color: var(--text-main);">Client-side JSON Web Token decoder & claims analyzer</p>
            </div>
            <a href="index.html" class="back-link">&larr; Launchpad</a>
        </header>

        <main>
            <div class="panel">
                <div class="form-group">
                    <label for="jwt-input">Paste JWT Token Stream</label>
                    <textarea id="jwt-input" placeholder="eyJhbGciOiJIUzI1NiIsIn..." oninput="inspectJWT()"></textarea>
                </div>
                <div id="token-status" style="margin-top: 1rem;"></div>
            </div>

            <div class="grid-outputs">
                <div class="panel" style="margin-bottom: 0;">
                    <label>Header Segment</label>
                    <pre id="jwt-header">// Header buffer empty</pre>
                </div>
                <div class="panel" style="margin-bottom: 0;">
                    <label>Payload Claims Segment</label>
                    <pre id="jwt-payload">// Payload buffer empty</pre>
                </div>
            </div>
        </main>

        <footer style="margin-top: 3rem; text-align: center; font-size: 0.75rem; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px;">
            Kodai Tech // Code local. Think fast.
        </footer>
    </div>

    <script>
        function base64UrlDecode(str) {
            let output = str.replace(/-/g, '+').replace(/_/g, '/');
            switch (output.length % 4) { case 0: break; case 2: output += '=='; break; case 3: output += '='; break; }
            return decodeURIComponent(atob(output).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        }
        function inspectJWT() {
            const rawToken = document.getElementById('jwt-input').value.trim();
            const headerEl = document.getElementById('jwt-header');
            const payloadEl = document.getElementById('jwt-payload');
            const statusEl = document.getElementById('token-status');
            if (!rawToken) { headerEl.textContent = '// Header buffer empty'; payloadEl.textContent = '// Payload buffer empty'; statusEl.innerHTML = ''; return; }
            const parts = rawToken.split('.');
            if (parts.length !== 3) { statusEl.innerHTML = '<span class="status-badge status-invalid">ERR: Invalid structure (3 parts expected)</span>'; headerEl.textContent = '// Error'; payloadEl.textContent = '// Error'; return; }
            try {
                headerEl.textContent = JSON.stringify(JSON.parse(base64UrlDecode(parts[0])), null, 2);
                const payload = JSON.parse(base64UrlDecode(parts[1]));
                payloadEl.textContent = JSON.stringify(payload, null, 2);
                if (payload.exp) {
                    const now = Math.floor(Date.now() / 1000);
                    const expDate = new Date(payload.exp * 1000).toLocaleString();
                    if (payload.exp < now) {
                        statusEl.innerHTML = `<span class="status-badge status-expired">STATUS: EXPIRED [${expDate}]</span>`;
                    } else {
                        statusEl.innerHTML = `<span class="status-badge status-valid">STATUS: VALID [Expires: ${expDate}]</span>`;
                    }
                } else {
                    statusEl.innerHTML = '<span class="status-badge status-invalid">STATUS: NO EXP CLAIM (exp) FOUND</span>';
                }
            } catch (e) {
                statusEl.innerHTML = '<span class="status-badge status-invalid">ERR: Parsing failed</span>';
                headerEl.textContent = '// Malformed';
                payloadEl.textContent = '// Malformed';
            }
        }
    </script>
</body>
</html>
