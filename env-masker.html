<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Env & Config Masker — Kodai Tech</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .output-wrapper { position: relative; }
        .btn-copy {
            position: absolute;
            top: 32px;
            right: 10px;
            background: var(--border-terminal);
            color: var(--text-bright);
            border: none;
            padding: 0.3rem 0.6rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-copy:hover { background: var(--accent-primary); color: var(--bg-terminal); }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-left">
            <img src="assets/img/logo.jpg" alt="Logo" class="logo">
            <div class="header-title">
                <h1>Env & Config Masker</h1>
                <p>Safely sanitize `.env` files before sharing</p>
            </div>
        </div>
        <a href="index.html" class="back-link">&larr; Launchpad</a>
    </header>

    <main class="workspace">
        <div class="panel">
            <div class="form-group">
                <label for="input-env">Raw Config Stream</label>
                <textarea id="input-env" style="height: 150px;" placeholder="PORT=3000&#10;DATABASE_URL=postgres://user:secret@localhost:5432/db"></textarea>
            </div>
            <button class="btn-primary" onclick="maskEnv()">// Execute Masking</button>
        </div>

        <div class="panel output-wrapper">
            <div class="form-group">
                <label for="output-env">Sanitized Output Stream</label>
                <button class="btn-copy" onclick="copyOutput()">Copy</button>
                <textarea id="output-env" readonly style="height: 150px;" placeholder="Masked config..."></textarea>
            </div>
        </div>
    </main>

    <footer>
        Kodai Tech // Code local. Think fast.
    </footer>

    <script>
        function maskEnv() {
            const text = document.getElementById('input-env').value;
            if (!text) { document.getElementById('output-env').value = ''; return; }
            const lines = text.split('\n');
            const masked = lines.map(line => {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#') || !trimmed.includes('=')) return line;
                const eq = line.indexOf('=');
                const key = line.substring(0, eq);
                const val = line.substring(eq + 1);
                if (!val.trim() || val.includes('[MASKED]')) return line;
                const upperKey = key.toUpperCase();
                const keywords = ['KEY', 'SECRET', 'PASSWORD', 'PASS', 'TOKEN', 'AUTH', 'PRIVATE', 'JWT', 'DATABASE_URL', 'DB_CONN'];
                if (keywords.some(k => upperKey.includes(k))) return `${key}=[[MASKED]]`;
                return line;
            });
            document.getElementById('output-env').value = masked.join('\n');
        }
        function copyOutput() {
            const output = document.getElementById('output-env');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            const btn = document.querySelector('.btn-copy');
            btn.textContent = 'OK';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        }
    </script>
</body>
</html>
