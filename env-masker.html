<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Env & Config Masker — Kodai Tech</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .tool-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #ffffff;
        }
        textarea {
            width: 100%;
            height: 160px;
            padding: 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: var(--font-code);
            font-size: 0.9rem;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        button.btn-primary {
            background-color: var(--accent-hover);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 1.5rem;
            transition: background-color 0.2s;
        }
        button.btn-primary:hover {
            background-color: var(--accent-color);
            color: #0d1117;
        }
        .output-container {
            position: relative;
        }
        .btn-copy {
            position: absolute;
            top: 35px;
            right: 10px;
            background: var(--border-color);
            color: var(--text-primary);
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .btn-copy:hover {
            background: var(--accent-color);
            color: #0d1117;
        }
    </style>
</head>
<body>

    <div class="tool-container">
        <a href="index.html" class="back-link">&larr; Back to Launchpad</a>
        
        <header style="border: none; margin-bottom: 1.5rem; padding-bottom: 0;">
            <div class="header-title" style="display: flex; align-items: center; gap: 1rem;">
                <img src="assets/img/logo.jpg" alt="Logo" style="width: 48px; height: 48px; border-radius: 8px; object-fit: cover;">
                <div>
                    <h1>Env & Config Masker</h1>
                    <p>Safely sanitize `.env` files and configuration secrets before sharing</p>
                </div>
            </div>
        </header>

        <div class="form-group">
            <label for="input-env">Raw `.env` or Configuration Content</label>
            <textarea id="input-env" placeholder="PORT=3000&#10;DATABASE_URL=postgres://user:secretpassword@localhost:5432/db&#10;OPENAI_API_KEY=sk-proj-abcdef1234567890"></textarea>
        </div>

        <button class="btn-primary" onclick="maskEnv()">Mask Sensitive Values</button>

        <div class="form-group output-container">
            <label for="output-env">Masked Output</label>
            <button class="btn-copy" onclick="copyOutput()">Copy</button>
            <textarea id="output-env" readonly placeholder="Masked configuration will appear here..."></textarea>
        </div>
    </div>

    <script>
        function maskEnv() {
            const text = document.getElementById('input-env').value;
            if (!text) {
                document.getElementById('output-env').value = '';
                return;
            }

            const lines = text.split('\n');
            const maskedLines = lines.map(line => {
                // Ignore comments or empty lines
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#') || !trimmed.includes('=')) {
                    return line;
                }

                const eqIndex = line.indexOf('=');
                const key = line.substring(0, eqIndex);
                const val = line.substring(eqIndex + 1);

                // If value is already empty or already masked, leave it
                if (!val.trim() || val.includes('[MASKED]')) {
                    return line;
                }

                // Check if key contains sensitive keywords or pattern matches secrets
                const upperKey = key.toUpperCase();
                const sensitiveKeywords = ['KEY', 'SECRET', 'PASSWORD', 'PASS', 'TOKEN', 'AUTH', 'PRIVATE', 'JWT', 'DATABASE_URL', 'DB_CONN'];
                const isSensitive = sensitiveKeywords.some(keyword => upperKey.includes(keyword));

                if (isSensitive) {
                    return `${key}=[[MASKED]]`;
                }

                return line;
            });

            document.getElementById('output-env').value = maskedLines.join('\n');
        }

        function copyOutput() {
            const output = document.getElementById('output-env');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            
            const btn = document.querySelector('.btn-copy');
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 1500);
        }
    </script>

</body>
</html>
