<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Env & Config Masker — Kodai Tech</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-terminal);
            border-top: 2px solid var(--accent-primary);
            padding: 2rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-bright);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        textarea {
            width: 100%;
            height: 140px;
            padding: 1rem;
            background-color: var(--bg-terminal);
            border: 1px solid var(--border-terminal);
            border-radius: 2px;
            color: var(--text-bright);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .btn-copy {
            background: var(--border-terminal);
            color: var(--text-bright);
            border: none;
            padding: 0.3rem 0.8rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-copy:hover {
            background: var(--accent-primary);
            color: var(--bg-terminal);
        }
    </style>
</head>
<body>

    <div class="tool-container">
        <header class="app-header" style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-terminal); padding-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 style="font-size: 1.2rem; color: var(--text-bright); text-transform: uppercase;">Env & Config Masker</h1>
                <p style="font-size: 0.8rem; color: var(--text-main);">Safely sanitize `.env` files before sharing</p>
            </div>
            <a href="index.html" class="back-link">&larr; Launchpad</a>
        </header>

        <main>
            <div class="panel">
                <div class="form-group">
                    <label for="input-env">Raw Config Stream</label>
                    <textarea id="input-env" placeholder="PORT=3000&#10;DATABASE_URL=postgres://user:secret@localhost:5432/db"></textarea>
                </div>
                <button class="btn-primary" style="margin-top: 1rem;" onclick="maskEnv()">// Execute Masking</button>
            </div>

            <div class="panel">
                <div class="form-group">
                    <div class="output-header">
                        <label for="output-env" style="margin-bottom: 0;">Sanitized Output Stream</label>
                        <button class="btn-copy" onclick="copyOutput()">Copy</button>
                    </div>
                    <textarea id="output-env" readonly placeholder="Masked config will appear here..."></textarea>
                </div>
            </div>
        </main>

        <footer style="margin-top: 3rem; text-align: center; font-size: 0.75rem; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px;">
            Kodai Tech // Code local. Think fast.
        </footer>
    </div>

    <script>
        function maskEnv() {
            const text = document.getElementById('input-env').value;
            if (!text) { document.getElementById('output-env').value = ''; return; }
            const lines = text.split('\n');
            const masked = lines.map(line => {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#') || !trimmed.includes('=')) return line;
                const eq = line.indexOf('=');
                const key = line.substring(0, eq);
                const val = line.substring(eq + 1);
                if (!val.trim() || val.includes('[MASKED]')) return line;
                const upperKey = key.toUpperCase();
                const keywords = ['KEY', 'SECRET', 'PASSWORD', 'PASS', 'TOKEN', 'AUTH', 'PRIVATE', 'JWT', 'DATABASE_URL', 'DB_CONN'];
                if (keywords.some(k => upperKey.includes(k))) return `${key}=[[MASKED]]`;
                return line;
            });
            document.getElementById('output-env').value = masked.join('\n');
        }
        function copyOutput() {
            const output = document.getElementById('output-env');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            const btn = document.querySelector('.btn-copy');
            btn.textContent = 'OK';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        }
    </script>
</body>
</html>
