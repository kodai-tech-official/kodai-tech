<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Env & Config Masker — Kodai Tech</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .tool-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-terminal);
            border-top: 3px solid var(--accent-primary);
            padding: 2rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--accent-primary);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .back-link:hover { text-decoration: underline; }
        .form-group { margin-bottom: 1.5rem; }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-bright);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        textarea {
            width: 100%;
            height: 160px;
            padding: 1rem;
            background-color: var(--bg-terminal);
            border: 1px solid var(--border-terminal);
            border-radius: 2px;
            color: var(--text-bright);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: var(--accent-primary); }
        button.btn-primary {
            background-color: transparent;
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease;
        }
        button.btn-primary:hover { background-color: var(--accent-primary); color: var(--bg-terminal); }
        .output-container { position: relative; }
        .btn-copy {
            position: absolute;
            top: 32px;
            right: 8px;
            background: var(--border-terminal);
            color: var(--text-bright);
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-copy:hover { background: var(--accent-primary); color: var(--bg-terminal); }
    </style>
</head>
<body>
    <div class="tool-container">
        <a href="index.html" class="back-link">&larr; Return to Launchpad</a>
        <header style="border: none; margin-bottom: 1.5rem; padding-bottom: 0;">
            <div class="header-title" style="display: flex; align-items: center; gap: 1rem;">
                <img src="assets/img/logo.jpg" alt="Logo" style="width: 48px; height: 48px; border-radius: 2px; object-fit: cover; border: 1px solid var(--accent-primary);">
                <div>
                    <h1>Env & Config Masker</h1>
                    <p>Safely sanitize `.env` files before sharing</p>
                </div>
            </div>
        </header>
        <div class="form-group">
            <label for="input-env">Raw Config Content</label>
            <textarea id="input-env" placeholder="PORT=3000&#10;DATABASE_URL=postgres://user:secret@localhost:5432/db"></textarea>
        </div>
        <button class="btn-primary" onclick="maskEnv()">// Execute Masking</button>
        <div class="form-group output-container">
            <label for="output-env">Sanitized Output</label>
            <button class="btn-copy" onclick="copyOutput()">Copy</button>
            <textarea id="output-env" readonly placeholder="Masked config..."></textarea>
        </div>
    </div>
    <script>
        function maskEnv() {
            const text = document.getElementById('input-env').value;
            if (!text) { document.getElementById('output-env').value = ''; return; }
            const lines = text.split('\n');
            const masked = lines.map(line => {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#') || !trimmed.includes('=')) return line;
                const eq = line.indexOf('=');
                const key = line.substring(0, eq);
                const val = line.substring(eq + 1);
                if (!val.trim() || val.includes('[MASKED]')) return line;
                const upperKey = key.toUpperCase();
                const keywords = ['KEY', 'SECRET', 'PASSWORD', 'PASS', 'TOKEN', 'AUTH', 'PRIVATE', 'JWT', 'DATABASE_URL', 'DB_CONN'];
                if (keywords.some(k => upperKey.includes(k))) return `${key}=[[MASKED]]`;
                return line;
            });
            document.getElementById('output-env').value = masked.join('\n');
        }
        function copyOutput() {
            const output = document.getElementById('output-env');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            const btn = document.querySelector('.btn-copy');
            btn.textContent = 'OK';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        }
    </script>
</body>
</html>
