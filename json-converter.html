<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON-to-TS Converter — Kodai Tech</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .output-wrapper { position: relative; }
        .btn-copy {
            position: absolute;
            top: 32px;
            right: 10px;
            background: var(--border-terminal);
            color: var(--text-bright);
            border: none;
            padding: 0.3rem 0.6rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-copy:hover { background: var(--accent-primary); color: var(--bg-terminal); }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-left">
            <img src="assets/img/logo.jpg" alt="Logo" class="logo">
            <div class="header-title">
                <h1>JSON-to-TS Converter</h1>
                <p>Convert raw JSON payloads into TypeScript interfaces</p>
            </div>
        </div>
        <a href="index.html" class="back-link">&larr; Launchpad</a>
    </header>

    <main class="workspace">
        <div class="panel">
            <div class="form-group">
                <label for="input-json">Raw JSON Payload Stream</label>
                <textarea id="input-json" style="height: 150px;" placeholder='{ "id": 1, "name": "Kodai Tech", "active": true }'></textarea>
            </div>
            <button class="btn-primary" onclick="convertJsonToTs()">// Parse & Convert</button>
        </div>

        <div class="panel output-wrapper">
            <div class="form-group">
                <label for="output-ts">TypeScript Interface Output</label>
                <button class="btn-copy" onclick="copyOutput()">Copy</button>
                <textarea id="output-ts" readonly style="height: 150px;" placeholder="TypeScript definitions..."></textarea>
            </div>
        </div>
    </main>

    <footer>
        Kodai Tech // Code local. Think fast.
    </footer>

    <script>
        function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
        function inferType(value, key, interfaces) {
            if (value === null) return 'null';
            const type = typeof value;
            if (type === 'string' || type === 'number' || type === 'boolean') return type;
            if (Array.isArray(value)) {
                if (value.length === 0) return 'any[]';
                const first = value[0];
                if (typeof first === 'object' && first !== null) {
                    const subName = capitalize(key) + 'Item';
                    parseObjectToInterface(first, subName, interfaces);
                    return subName + '[]';
                }
                return typeof first + '[]';
            }
            if (type === 'object') {
                const subName = capitalize(key);
                parseObjectToInterface(value, subName, interfaces);
                return subName;
            }
            return 'any';
        }
        function parseObjectToInterface(obj, name, interfaces) {
            let fields = [];
            for (const key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    fields.push(`  ${key}: ${inferType(obj[key], key, interfaces)};`);
                }
            }
            interfaces.push(`interface ${name} {\n${fields.join('\n')}\n}`);
        }
        function convertJsonToTs() {
            const raw = document.getElementById('input-json').value.trim();
            const outputEl = document.getElementById('output-ts');
            if (!raw) { outputEl.value = ''; return; }
            try {
                const parsed = JSON.parse(raw);
                let interfaces = [];
                parseObjectToInterface(parsed, 'RootObject', interfaces);
                outputEl.value = interfaces.reverse().join('\n\n');
            } catch (e) {
                outputEl.value = `// JSON_ERR: ${e.message}`;
            }
        }
        function copyOutput() {
            const output = document.getElementById('output-ts');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            const btn = document.querySelector('.btn-copy');
            btn.textContent = 'OK';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        }
    </script>
</body>
</html>
