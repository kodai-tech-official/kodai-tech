<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON-to-TS Converter — Kodai Tech</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .tool-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #ffffff;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: var(--font-code);
            font-size: 0.9rem;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        button.btn-primary {
            background-color: var(--accent-hover);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 1.5rem;
            transition: background-color 0.2s;
        }
        button.btn-primary:hover {
            background-color: var(--accent-color);
            color: #0d1117;
        }
        .output-container {
            position: relative;
        }
        .btn-copy {
            position: absolute;
            top: 35px;
            right: 10px;
            background: var(--border-color);
            color: var(--text-primary);
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .btn-copy:hover {
            background: var(--accent-color);
            color: #0d1117;
        }
    </style>
</head>
<body>

    <div class="tool-container">
        <a href="index.html" class="back-link">&larr; Back to Launchpad</a>
        
        <header style="border: none; margin-bottom: 1.5rem; padding-bottom: 0;">
            <div class="header-title" style="display: flex; align-items: center; gap: 1rem;">
                <img src="assets/img/logo.jpg" alt="Logo" style="width: 48px; height: 48px; border-radius: 8px; object-fit: cover;">
                <div>
                    <h1>JSON-to-TS Converter</h1>
                    <p>Convert raw JSON payloads into clean TypeScript interfaces</p>
                </div>
            </div>
        </header>

        <div class="form-group">
            <label for="input-json">Raw JSON Payload</label>
            <textarea id="input-json" placeholder='{&#10;  "id": 1,&#10;  "name": "Kodai Tech",&#10;  "active": true,&#10;  "tags": ["code", "ai"]&#10;}'></textarea>
        </div>

        <button class="btn-primary" onclick="convertJsonToTs()">Convert to TypeScript Interface</button>

        <div class="form-group output-container">
            <label for="output-ts">TypeScript Output</label>
            <button class="btn-copy" onclick="copyOutput()">Copy</button>
            <textarea id="output-ts" readonly placeholder="TypeScript interfaces will appear here..."></textarea>
        </div>
    </div>

    <script>
        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function inferType(value, key, interfaces) {
            if (value === null) return 'null';
            const type = typeof value;
            if (type === 'string' || type === 'number' || type === 'boolean') {
                return type;
            }
            if (Array.isArray(value)) {
                if (value.length === 0) return 'any[]';
                const firstElem = value[0];
                if (typeof firstElem === 'object' && firstElem !== null) {
                    const subInterfaceName = capitalize(key) + 'Item';
                    parseObjectToInterface(firstElem, subInterfaceName, interfaces);
                    return subInterfaceName + '[]';
                } else {
                    return typeof firstElem + '[]';
                }
            }
            if (type === 'object') {
                const subInterfaceName = capitalize(key);
                parseObjectToInterface(value, subInterfaceName, interfaces);
                return subInterfaceName;
            }
            return 'any';
        }

        function parseObjectToInterface(obj, interfaceName, interfaces) {
            let fields = [];
            for (const key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    const tsType = inferType(obj[key], key, interfaces);
                    fields.push(`  ${key}: ${tsType};`);
                }
            }
            interfaces.push(`interface ${interfaceName} {\n${fields.join('\n')}\n}`);
        }

        function convertJsonToTs() {
            const raw = document.getElementById('input-json').value.trim();
            const outputEl = document.getElementById('output-ts');

            if (!raw) {
                outputEl.value = '';
                return;
            }

            try {
                const parsed = JSON.parse(raw);
                let interfaces = [];
                parseObjectToInterface(parsed, 'RootObject', interfaces);
                // Reverse to have root object at the bottom or top as preferred (top is cleaner)
                outputEl.value = interfaces.reverse().join('\n\n');
            } catch (e) {
                outputEl.value = `// Invalid JSON: ${e.message}`;
            }
        }

        function copyOutput() {
            const output = document.getElementById('output-ts');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            
            const btn = document.querySelector('.btn-copy');
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 1500);
        }
    </script>

</body>
</html>
