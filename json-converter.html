<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON-to-TS Converter — Kodai Tech</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .tool-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-terminal);
            border-top: 3px solid var(--accent-primary);
            padding: 2rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--accent-primary);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .back-link:hover { text-decoration: underline; }
        .form-group { margin-bottom: 1.5rem; }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-bright);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 1rem;
            background-color: var(--bg-terminal);
            border: 1px solid var(--border-terminal);
            border-radius: 2px;
            color: var(--text-bright);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: var(--accent-primary); }
        button.btn-primary {
            background-color: transparent;
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease;
        }
        button.btn-primary:hover { background-color: var(--accent-primary); color: var(--bg-terminal); }
        .output-container { position: relative; }
        .btn-copy {
            position: absolute;
            top: 32px;
            right: 8px;
            background: var(--border-terminal);
            color: var(--text-bright);
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-copy:hover { background: var(--accent-primary); color: var(--bg-terminal); }
    </style>
</head>
<body>
    <div class="tool-container">
        <a href="index.html" class="back-link">&larr; Return to Launchpad</a>
        <header style="border: none; margin-bottom: 1.5rem; padding-bottom: 0;">
            <div class="header-title" style="display: flex; align-items: center; gap: 1rem;">
                <img src="assets/img/logo.jpg" alt="Logo" style="width: 48px; height: 48px; border-radius: 2px; object-fit: cover; border: 1px solid var(--accent-primary);">
                <div>
                    <h1>JSON-to-TS Converter</h1>
                    <p>Convert raw JSON payloads into TypeScript interfaces</p>
                </div>
            </div>
        </header>
        <div class="form-group">
            <label for="input-json">Raw JSON Payload</label>
            <textarea id="input-json" placeholder='{ "id": 1, "name": "Kodai Tech", "active": true }'></textarea>
        </div>
        <button class="btn-primary" onclick="convertJsonToTs()">// Parse & Convert</button>
        <div class="form-group output-container">
            <label for="output-ts">TypeScript Interface Output</label>
            <button class="btn-copy" onclick="copyOutput()">Copy</button>
            <textarea id="output-ts" readonly placeholder="TypeScript definitions..."></textarea>
        </div>
    </div>
    <script>
        function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
        function inferType(value, key, interfaces) {
            if (value === null) return 'null';
            const type = typeof value;
            if (type === 'string' || type === 'number' || type === 'boolean') return type;
            if (Array.isArray(value)) {
                if (value.length === 0) return 'any[]';
                const first = value[0];
                if (typeof first === 'object' && first !== null) {
                    const subName = capitalize(key) + 'Item';
                    parseObjectToInterface(first, subName, interfaces);
                    return subName + '[]';
                }
                return typeof first + '[]';
            }
            if (type === 'object') {
                const subName = capitalize(key);
                parseObjectToInterface(value, subName, interfaces);
                return subName;
            }
            return 'any';
        }
        function parseObjectToInterface(obj, name, interfaces) {
            let fields = [];
            for (const key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    fields.push(`  ${key}: ${inferType(obj[key], key, interfaces)};`);
                }
            }
            interfaces.push(`interface ${name} {\n${fields.join('\n')}\n}`);
        }
        function convertJsonToTs() {
            const raw = document.getElementById('input-json').value.trim();
            const outputEl = document.getElementById('output-ts');
            if (!raw) { outputEl.value = ''; return; }
            try {
                const parsed = JSON.parse(raw);
                let interfaces = [];
                parseObjectToInterface(parsed, 'RootObject', interfaces);
                outputEl.value = interfaces.reverse().join('\n\n');
            } catch (e) {
                outputEl.value = `// JSON_ERR: ${e.message}`;
            }
        }
        function copyOutput() {
            const output = document.getElementById('output-ts');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            const btn = document.querySelector('.btn-copy');
            btn.textContent = 'OK';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        }
    </script>
</body>
</html>
