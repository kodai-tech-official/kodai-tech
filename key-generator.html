<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSPRNG Key Generator — Kodai Tech</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-terminal);
            border-top: 2px solid var(--accent-primary);
            padding: 2rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-bright);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-terminal);
            border: 1px solid var(--border-terminal);
            border-radius: 2px;
            color: var(--text-bright);
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 1rem;
            background-color: var(--bg-terminal);
            border: 1px solid var(--border-terminal);
            border-radius: 2px;
            color: var(--text-bright);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            resize: vertical;
        }
        .options-row {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            padding: 1rem 0;
            border-top: 1px solid var(--border-terminal);
            border-bottom: 1px solid var(--border-terminal);
            margin: 1.5rem 0;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-main);
            text-transform: uppercase;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .btn-copy {
            background: var(--border-terminal);
            color: var(--text-bright);
            border: none;
            padding: 0.3rem 0.8rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-copy:hover {
            background: var(--accent-primary);
            color: var(--bg-terminal);
        }
    </style>
</head>
<body>

    <div class="tool-container">
        <header class="app-header" style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-terminal); padding-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 style="font-size: 1.2rem; color: var(--text-bright); text-transform: uppercase;">CSPRNG Key Generator</h1>
                <p style="font-size: 0.8rem; color: var(--text-main);">Cryptographically secure pseudo-random secret generation</p>
            </div>
            <a href="index.html" class="back-link">&larr; Launchpad</a>
        </header>

        <main>
            <div class="panel">
                <div class="form-group">
                    <label for="format">Generation Format</label>
                    <select id="format" onchange="toggleOptions()">
                        <option value="hex">Hexadecimal (64-char / 256-bit default)</option>
                        <option value="base64">Base64 URL-Safe</option>
                        <option value="password">Custom Password / Alphanumeric Secret</option>
                    </select>
                </div>

                <div class="form-group" id="length-group">
                    <label for="length">Byte Length / Character Length</label>
                    <input type="number" id="length" value="32" min="8" max="256">
                </div>

                <div class="options-row" id="password-options" style="display: none;">
                    <label class="checkbox-label"><input type="checkbox" id="inc-upper" checked> Uppercase (A-Z)</label>
                    <label class="checkbox-label"><input type="checkbox" id="inc-lower" checked> Lowercase (a-z)</label>
                    <label class="checkbox-label"><input type="checkbox" id="inc-num" checked> Numbers (0-9)</label>
                    <label class="checkbox-label"><input type="checkbox" id="inc-sym" checked> Symbols (!@#$...)</label>
                </div>

                <button class="btn-primary" onclick="generateKey()">// Execute Generation</button>
            </div>

            <div class="panel">
                <div class="form-group">
                    <div class="output-header">
                        <label for="output" style="margin-bottom: 0;">Generated Output Buffer</label>
                        <button class="btn-copy" onclick="copyToClipboard()">Copy</button>
                    </div>
                    <textarea id="output" readonly placeholder="Secure output buffer..."></textarea>
                </div>
            </div>
        </main>

        <footer style="margin-top: 3rem; text-align: center; font-size: 0.75rem; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px;">
            Kodai Tech // Code local. Think fast.
        </footer>
    </div>

    <script>
        function toggleOptions() {
            const format = document.getElementById('format').value;
            const pwdOptions = document.getElementById('password-options');
            const lengthInput = document.getElementById('length');
            if (format === 'password') {
                pwdOptions.style.display = 'flex';
                lengthInput.value = '24';
            } else {
                pwdOptions.style.display = 'none';
                lengthInput.value = '32';
            }
        }
        function generateKey() {
            const format = document.getElementById('format').value;
            const length = parseInt(document.getElementById('length').value, 10) || 32;
            let result = '';
            if (format === 'hex') {
                const array = new Uint8Array(length);
                window.crypto.getRandomValues(array);
                result = Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
            } else if (format === 'base64') {
                const array = new Uint8Array(length);
                window.crypto.getRandomValues(array);
                let binary = '';
                array.forEach(b => binary += String.fromCharCode(b));
                result = btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
            } else if (format === 'password') {
                let chars = '';
                if (document.getElementById('inc-upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                if (document.getElementById('inc-lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
                if (document.getElementById('inc-num').checked) chars += '0123456789';
                if (document.getElementById('inc-sym').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
                if (chars.length === 0) { alert('Select at least one character set.'); return; }
                const array = new Uint32Array(length);
                window.crypto.getRandomValues(array);
                for (let i = 0; i < length; i++) { result += chars[array[i] % chars.length]; }
            }
            document.getElementById('output').value = result;
        }
        function copyToClipboard() {
            const output = document.getElementById('output');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            const btn = document.querySelector('.btn-copy');
            btn.textContent = 'OK';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        }
        generateKey();
    </script>
</body>
</html>
