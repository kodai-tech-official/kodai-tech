<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Sanitizer — Kodai Tech</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-terminal);
            border-top: 2px solid var(--accent-primary);
            padding: 2rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-bright);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        textarea {
            width: 100%;
            height: 140px;
            padding: 1rem;
            background-color: var(--bg-terminal);
            border: 1px solid var(--border-terminal);
            border-radius: 2px;
            color: var(--text-bright);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        .options-row {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            padding: 1rem 0;
            border-top: 1px solid var(--border-terminal);
            border-bottom: 1px solid var(--border-terminal);
            margin: 1.5rem 0;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-main);
            text-transform: uppercase;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .btn-copy {
            background: var(--border-terminal);
            color: var(--text-bright);
            border: none;
            padding: 0.3rem 0.8rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-copy:hover {
            background: var(--accent-primary);
            color: var(--bg-terminal);
        }
        .stats {
            margin-top: 0.75rem;
            font-size: 0.75rem;
            color: var(--accent-warning);
        }
    </style>
</head>
<body>

    <div class="tool-container">
        <header class="app-header" style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-terminal); padding-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 style="font-size: 1.2rem; color: var(--text-bright); text-transform: uppercase;">Prompt Sanitizer</h1>
                <p style="font-size: 0.8rem; color: var(--text-main);">AI context reducer, log cleaner & whitespace optimizer</p>
            </div>
            <a href="index.html" class="back-link">&larr; Launchpad</a>
        </header>

        <main>
            <div class="panel">
                <div class="form-group">
                    <label for="input-prompt">Raw Input Stream / Log</label>
                    <textarea id="input-prompt" placeholder="Paste messy log or prompt..."></textarea>
                </div>

                <div class="options-row">
                    <label class="checkbox-label"><input type="checkbox" id="opt-comments" checked> Strip Comments</label>
                    <label class="checkbox-label"><input type="checkbox" id="opt-whitespace" checked> Collapse Spaces</label>
                    <label class="checkbox-label"><input type="checkbox" id="opt-newlines" checked> Remove Empty Lines</label>
                    <label class="checkbox-label"><input type="checkbox" id="opt-secrets"> Mask API Keys</label>
                </div>

                <button class="btn-primary" onclick="sanitizePrompt()">// Execute Sanitization</button>
            </div>

            <div class="panel">
                <div class="form-group">
                    <div class="output-header">
                        <label for="output-prompt" style="margin-bottom: 0;">Optimized Buffer Output</label>
                        <button class="btn-copy" onclick="copyOutput()">Copy</button>
                    </div>
                    <textarea id="output-prompt" readonly placeholder="Clean output stream..."></textarea>
                    <div class="stats" id="stats-box">Original: 0c &bull; Optimized: 0c &bull; Reduction: 0%</div>
                </div>
            </div>
        </main>

        <footer style="margin-top: 3rem; text-align: center; font-size: 0.75rem; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px;">
            Kodai Tech // Code local. Think fast.
        </footer>
    </div>

    <script>
        function sanitizePrompt() {
            let text = document.getElementById('input-prompt').value;
            const originalLength = text.length;
            if (!text) { document.getElementById('output-prompt').value = ''; document.getElementById('stats-box').innerHTML = 'Buffer empty'; return; }
            if (document.getElementById('opt-comments').checked) { text = text.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*/g, '$1'); }
            if (document.getElementById('opt-newlines').checked) { text = text.split('\n').filter(l => l.trim() !== '').join('\n'); }
            if (document.getElementById('opt-whitespace').checked) { text = text.split('\n').map(l => l.replace(/[ \t]+/g, ' ').trim()).join('\n'); }
            if (document.getElementById('opt-secrets').checked) { text = text.replace(/(sk-[a-zA-Z0-9]{20,}|bearer\s+[a-zA-Z0-9._-]+|api[_-]?key[=:]\s*['"]?[a-zA-Z0-9-_]{16,}['"]?)/gi, '[REDACTED_SECRET]'); }
            document.getElementById('output-prompt').value = text;
            const newLength = text.length;
            const reduction = originalLength > 0 ? Math.max(0, ((originalLength - newLength) / originalLength) * 100).toFixed(1) : 0;
            document.getElementById('stats-box').innerHTML = `Original: ${originalLength}c &bull; Optimized: ${newLength}c &bull; Reduction: ${reduction}%`;
        }
        function copyOutput() {
            const output = document.getElementById('output-prompt');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            const btn = document.querySelector('.btn-copy');
            btn.textContent = 'OK';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        }
    </script>
</body>
</html>
