<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Workbench — Kodai Tech</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .tool-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #ffffff;
        }
        .regex-row {
            display: flex;
            gap: 1rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--accent-color);
            font-family: var(--font-code);
            font-size: 1rem;
        }
        .flags-box {
            display: flex;
            gap: 1rem;
            align-items: center;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0 1rem;
            border-radius: 6px;
        }
        .flags-box label {
            margin-bottom: 0;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: var(--font-code);
        }
        textarea {
            width: 100%;
            height: 140px;
            padding: 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: var(--font-code);
            font-size: 0.95rem;
            resize: vertical;
        }
        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .results-section {
            margin-top: 1.5rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
        }
        .results-section h3 {
            font-size: 1rem;
            color: var(--accent-color);
            margin-bottom: 0.75rem;
            font-family: var(--font-code);
        }
        .match-item {
            background-color: #161b22;
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            font-family: var(--font-code);
            font-size: 0.85rem;
        }
        .match-item span {
            color: #7ee787;
        }
        .no-matches {
            color: var(--text-secondary);
            font-style: italic;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="tool-container">
        <a href="index.html" class="back-link">&larr; Back to Launchpad</a>
        
        <header style="border: none; margin-bottom: 1.5rem; padding-bottom: 0;">
            <div class="header-title" style="display: flex; align-items: center; gap: 1rem;">
                <img src="assets/img/logo.jpg" alt="Logo" style="width: 48px; height: 48px; border-radius: 8px; object-fit: cover;">
                <div>
                    <h1>Regex Workbench</h1>
                    <p>Real-time regular expression testing and matching utility</p>
                </div>
            </div>
        </header>

        <div class="form-group">
            <label for="pattern">Regular Expression Pattern</label>
            <div class="regex-row">
                <input type="text" id="pattern" placeholder="e.g. \b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b" oninput="runRegex()">
                <div class="flags-box">
                    <label><input type="checkbox" id="flag-g" checked onchange="runRegex()"> g</label>
                    <label><input type="checkbox" id="flag-i" checked onchange="runRegex()"> i</label>
                    <label><input type="checkbox" id="flag-m" onchange="runRegex()"> m</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="test-string">Test String</label>
            <textarea id="test-string" placeholder="Paste your test text here..." oninput="runRegex()">Contact us at support@kodaitech.io or test.user@domain.com for info.</textarea>
        </div>

        <div class="results-section">
            <h3 id="match-count">Matches: 0</h3>
            <div id="matches-output">
                <span class="no-matches">Enter a valid regex and test string to see matches.</span>
            </div>
        </div>
    </div>

    <script>
        function runRegex() {
            const patternStr = document.getElementById('pattern').value;
            const testStr = document.getElementById('test-string').value;
            const outputEl = document.getElementById('matches-output');
            const countEl = document.getElementById('match-count');

            if (!patternStr) {
                countEl.textContent = 'Matches: 0';
                outputEl.innerHTML = '<span class="no-matches">Please enter a regex pattern.</span>';
                return;
            }

            let flags = '';
            if (document.getElementById('flag-g').checked) flags += 'g';
            if (document.getElementById('flag-i').checked) flags += 'i';
            if (document.getElementById('flag-m').checked) flags += 'm';

            try {
                const regex = new RegExp(patternStr, flags);
                let matches = [];
                let match;

                if (flags.includes('g')) {
                    while ((match = regex.exec(testStr)) !== null) {
                        matches.push({
                            match: match[0],
                            index: match.index,
                            groups: match.slice(1)
                        });
                        // Prevent infinite loops on zero-length matches
                        if (match.index === regex.lastIndex) {
                            regex.lastIndex++;
                        }
                    }
                } else {
                    match = regex.exec(testStr);
                    if (match) {
                        matches.push({
                            match: match[0],
                            index: match.index,
                            groups: match.slice(1)
                        });
                    }
                }

                countEl.textContent = `Matches: ${matches.length}`;

                if (matches.length === 0) {
                    outputEl.innerHTML = '<span class="no-matches">No matches found.</span>';
                    return;
                }

                let html = '';
                matches.forEach((m, idx) => {
                    html += `<div class="match-item">
                        <strong>#${idx + 1}</strong> &bull; Index: <code>${m.index}</code> &bull; Match: <span>${escapeHtml(m.match)}</span>`;
                    if (m.groups.length > 0) {
                        html += `<br><small style="color: var(--text-secondary);">Groups: ${m.groups.map(g => `<code>${escapeHtml(String(g))}</code>`).join(', ')}</small>`;
                    }
                    html += `</div>`;
                });
                outputEl.innerHTML = html;

            } catch (e) {
                countEl.textContent = 'Matches: 0';
                outputEl.innerHTML = `<span class="no-matches" style="color: #f85149;">Regex Error: ${escapeHtml(e.message)}</span>`;
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Run on load
        runRegex();
    </script>

</body>
</html>
